interface:
  display_name: "Get Read Action Run"
  short_description: "Read an earlier Sanka read Action run by its run id, with its status, result and method, free of charge."
  default_prompt: "Use $sanka:get-read-action-run to read an earlier Sanka read Action run by its run id, with its status, result and method, free of charge."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
