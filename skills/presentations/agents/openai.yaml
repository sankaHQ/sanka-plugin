interface:
  display_name: "Presentations"
  short_description: "Create and revise Sanka Doc presentations, preview slides and export PowerPoint, PDF or Google Slides."
  default_prompt: "Use $sanka:presentations to create and revise Sanka Doc presentations, preview slides and export PowerPoint, PDF or Google Slides."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
