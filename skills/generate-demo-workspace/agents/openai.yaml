interface:
  display_name: "Generate Demo Workspace"
  short_description: "Build a new Free demo workspace for a Sanka Desk, Sanka Flow, Sanka Monitor or Sanka Migrate demo."
  default_prompt: "Use $sanka:generate-demo-workspace to build a new Free demo workspace for a Sanka Desk, Sanka Flow, Sanka Monitor or Sanka Migrate demo."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
