interface:
  display_name: "Sync Sandbox Data"
  short_description: "Copy selected production records into a live Sanka sandbox."
  default_prompt: "Use $sanka:sync-sandbox-data to copy selected production records into a live Sanka sandbox."

dependencies:
  tools:
    - type: "mcp"
      value: "sakura"
      description: "Hosted Sakura MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
