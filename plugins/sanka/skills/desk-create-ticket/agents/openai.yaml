interface:
  display_name: "Desk Create Ticket"
  short_description: "File an IT request with Sanka Desk, the company's IT service desk, in the user's own words."
  default_prompt: "Use $sanka:desk-create-ticket to file an IT request with Sanka Desk, the company's IT service desk, in the user's own words."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
