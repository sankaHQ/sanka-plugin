interface:
  display_name: "Import Presentation Image"
  short_description: "Import a public image URL into a presentation."
  default_prompt: "Use $sanka:import-presentation-image to import a public image URL into a presentation."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
