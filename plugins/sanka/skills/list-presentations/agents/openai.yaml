interface:
  display_name: "List Presentations"
  short_description: "Find presentations in Sanka Flow Docs or a migration program."
  default_prompt: "Use $sanka:list-presentations to find presentations in Sanka Flow Docs or a migration program."

dependencies:
  tools:
