interface:
  display_name: "Download Presentation Export"
  short_description: "Retrieve a completed PowerPoint or PDF file through MCP."
  default_prompt: "Use $sanka:download-presentation-export to retrieve a completed PowerPoint or PDF file through MCP."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
