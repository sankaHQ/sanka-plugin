interface:
  display_name: "Get Presentation Export"
  short_description: "Check export progress and retrieve its result link."
  default_prompt: "Use $sanka:get-presentation-export to check export progress and retrieve its result link."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
