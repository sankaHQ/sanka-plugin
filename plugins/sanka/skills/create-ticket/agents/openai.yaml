interface:
  display_name: "Create Ticket"
  short_description: "Create a customer support ticket in live Sanka Flow."
  default_prompt: "Use $sanka:create-ticket to create a customer support ticket in live Sanka Flow."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
