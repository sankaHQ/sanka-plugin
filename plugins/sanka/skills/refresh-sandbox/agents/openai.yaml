interface:
  display_name: "Refresh Sandbox"
  short_description: "Permanently replace a live Sanka sandbox with a fresh production copy."
  default_prompt: "Use $sanka:refresh-sandbox to permanently replace a live Sanka sandbox with a fresh production copy."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
