interface:
  display_name: "Desk Run Action"
  short_description: "File a Sanka Desk Action the user confirmed after its preview, as a Desk ticket with Desk's approvals."
  default_prompt: "Use $sanka:desk-run-action to file a Sanka Desk Action the user confirmed after its preview, as a Desk ticket with Desk's approvals."

dependencies:
  tools:
    - type: "mcp"
      value: "sanka"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
