  short_description: "Ask Sanka Desk, the company's IT service desk, for an IT change such as a HubSpot, Salesforce, Google Workspace, Microsoft 365, Okta, Slack or Sanka Flow account, access or license, previewed and confirmed before anything is filed."
  default_prompt: "Use $sanka:desk-actions to ask Sanka Desk, the company's IT service desk, for an IT change such as a HubSpot, Salesforce, Google Workspace, Microsoft 365, Okta, Slack or Sanka Flow account, access or license, previewed and confirmed before anything is filed."

dependencies:
