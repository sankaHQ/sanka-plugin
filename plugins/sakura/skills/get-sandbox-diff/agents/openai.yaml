interface:
  display_name: "Get Sandbox Diff"
  short_description: "Compare a live Sanka sandbox configuration with production."
  default_prompt: "Use $sanka:get-sandbox-diff to compare a live Sanka sandbox configuration with production."

dependencies:
  tools:
    - type: "mcp"
      value: "sakura"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
