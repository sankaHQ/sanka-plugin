interface:
  display_name: "Reply Workspace Message Thread"
  short_description: "Reply from a shared workspace inbox in live Sanka."
  default_prompt: "Use $sanka:reply-workspace-message-thread to reply from a shared workspace inbox in live Sanka."

dependencies:
  tools:
    - type: "mcp"
      value: "sakura"
      description: "Hosted Sakura MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
