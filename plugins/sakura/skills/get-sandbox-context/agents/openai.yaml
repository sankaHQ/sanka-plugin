interface:
  display_name: "Get Sandbox Context"
  short_description: "Check whether the current live Sanka workspace is a sandbox."
  default_prompt: "Use $sanka:get-sandbox-context to check whether the current live Sanka workspace is a sandbox."

dependencies:
  tools:
    - type: "mcp"
      value: "sakura"
      description: "Hosted Sanka MCP server for live Sanka workflows"
      transport: "streamable_http"
      url: "https://mcp.sanka.com/mcp"

policy:
  allow_implicit_invocation: false
